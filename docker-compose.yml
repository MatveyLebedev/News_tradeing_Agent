services:
  telegram-bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    container_name: telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/New_York
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  news-fetcher:
    build:
      context: .
      dockerfile: bloomberg_news_fetcher/Dockerfile.news
    container_name: bloomberg_news_fetcher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Timezone
      - TZ=America/New_York
      
      # Fetch interval in minutes
      - FETCH_INTERVAL_MIN=5

      # Console output verbosity
      - VERBOSE=true
      
      # Enable price fetching
      - FETCH_PRICES=true

      # Full text scraping (off by default - saves time)
      - FETCH_FULL_TEXT=false
      
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  price-fetcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price_fetcher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/New_York
      - FETCH_TIME=22:00
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Long-term agent (Phase 6) -------------------------------------------
  # Weekly scheduler: runs the full pipeline across the universe, persists results,
  # grades matured cohorts, and pushes Telegram alerts for new/flipped signals.
  longterm-agent:
    build:
      context: .
      dockerfile: longterm_agent/Dockerfile
    image: longterm-agent          # built once, reused by longterm-stats-bot
    container_name: longterm_agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/New_York
      # Detection v2 cutover (2026-07-11, validated: VALIDATION_REPORT_v0.2.md).
      # Rollback = remove this line (v1 is the code default; v1 library stays intact).
      - LT_METRICS_VERSION=2
      # Override schedule here or in .env (defaults: Sunday 06:00 ET batch, daily 07:00 grade)
      # - LT_BATCH_WEEKDAY=sunday
      # - LT_BATCH_TIME=06:00
      # - LT_RUN_ON_START=false
      # LangSmith tracing of scheduled batches (default on; needs LANGCHAIN_API_KEY in .env)
      # - LT_TRACE=false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Read-only HTTP API over the raw `news` table for the external filtering
  # pipeline (news_api/README.md). Requires NEWS_API_KEY in .env.
  news-api:
    build:
      context: .
      dockerfile: news_api/Dockerfile
    container_name: news_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/New_York
    ports:
      # Host port kept non-standard: default DB-style ports are ISP-blocked.
      - "${NEWS_API_PORT:-8710}:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Read-only Telegram stats bot: /stats /signals /trades /errors /ticker
  longterm-stats-bot:
    image: longterm-agent          # reuse the image built by longterm-agent
    container_name: longterm_stats_bot
    restart: unless-stopped
    depends_on:
      - longterm-agent
    env_file:
      - .env
    environment:
      - TZ=America/New_York
    command: ["python", "-u", "-m", "longterm_agent.stats_bot"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


